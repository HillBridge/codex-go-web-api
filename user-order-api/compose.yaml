services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: user_order_api
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uapp -papp_password --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
