<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
<title id="title">创建订单的 MySQL 持久化时序</title><desc id="desc">POST orders 经中间件、订单服务、用户 MySQL 仓储和订单 MySQL 仓储，最终写入 MySQL 并异步记录审计日志。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937}.t{font-size:29px;font-weight:700}.s{font-size:16px;fill:#475569}.a{fill:#fff;stroke:#94a3b8;stroke-width:2}.svc{fill:#fff7ed;stroke:#fb923c}.db{fill:#ecfeff;stroke:#22d3ee}.log{fill:#fdf2f8;stroke:#f472b6}.at{font-size:16px;font-weight:700}.as{font-size:13px;fill:#475569}.life{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 7}.c{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}.r{stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#a)}.async{stroke:#a21caf;stroke-width:2.5;stroke-dasharray:5 5;fill:none;marker-end:url(#a)}.l{font-size:14px;fill:#334155}</style></defs>
<rect width="1600" height="860" fill="#fff"/><text x="55" y="55" class="t">创建订单：MySQL 持久化请求时序</text><text x="55" y="84" class="s">Handler 传递 2 秒 Context；订单服务预检查用户，数据库外键作为并发安全的第二道防线。</text>
<g text-anchor="middle"><rect x="45" y="125" width="155" height="65" rx="12" class="a"/><text x="122" y="151" class="at">客户端</text><text x="122" y="174" class="as">调用方</text><rect x="265" y="125" width="170" height="65" rx="12" class="a"/><text x="350" y="151" class="at">HTTP 中间件</text><text x="350" y="174" class="as">日志 / request ID</text><rect x="500" y="125" width="165" height="65" rx="12" class="a"/><text x="582" y="151" class="at">Order Handler</text><text x="582" y="174" class="as">JSON / Context</text><rect x="730" y="125" width="165" height="65" rx="12" class="a svc"/><text x="812" y="151" class="at">Order Service</text><text x="812" y="174" class="as">业务规则</text><rect x="960" y="125" width="175" height="65" rx="12" class="a db"/><text x="1047" y="151" class="at">User Repository</text><text x="1047" y="174" class="as">MySQL 查询</text><rect x="1200" y="125" width="175" height="65" rx="12" class="a db"/><text x="1287" y="151" class="at">Order Repository</text><text x="1287" y="174" class="as">MySQL 写入</text><rect x="1440" y="125" width="115" height="65" rx="12" class="a log"/><text x="1497" y="151" class="at">审计日志</text><text x="1497" y="174" class="as">异步</text></g>
<g class="life"><path d="M122 190V795"/><path d="M350 190V795"/><path d="M582 190V795"/><path d="M812 190V795"/><path d="M1047 190V795"/><path d="M1287 190V795"/><path d="M1497 190V795"/></g>
<path d="M122 245H350" class="c"/><text x="236" y="230" class="l" text-anchor="middle">POST /orders</text><path d="M350 305H582" class="c"/><text x="466" y="290" class="l" text-anchor="middle">转发请求</text><text x="582" y="348" class="l">DecodeJSON；创建 2 秒 Context</text><path d="M582 395H812" class="c"/><text x="697" y="380" class="l" text-anchor="middle">Create(ctx, userId, amount)</text><text x="812" y="438" class="l">校验 userId、amount</text><path d="M812 485H1047" class="c"/><text x="930" y="470" class="l" text-anchor="middle">FindByID(ctx, userId)</text><path d="M1047 535H812" class="r"/><text x="930" y="520" class="l" text-anchor="middle">User / ErrNotFound</text><path d="M812 600H1287" class="c"/><text x="1049" y="585" class="l" text-anchor="middle">INSERT orders (..., pending)</text><path d="M1287 650H812" class="r"/><text x="1049" y="635" class="l" text-anchor="middle">Order / 外键错误 → ErrUserNotFound</text><path d="M812 700H1497" class="async"/><text x="1155" y="685" class="l" text-anchor="middle">异步记录 order.created</text><path d="M812 750H582" class="r"/><path d="M582 795H122" class="r"/><text x="350" y="780" class="l" text-anchor="middle">201 JSON / 400 JSON</text>
</svg>
