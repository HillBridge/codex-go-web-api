<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1180" viewBox="0 0 2200 1180" role="img" aria-labelledby="title desc">
  <title id="title">创建订单的请求时序</title>
  <desc id="desc">POST orders 请求经日志中间件、订单服务、用户服务与内存仓储处理，并异步写入审计日志的时序图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a21caf"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2937; }
      .title { font-size: 34px; font-weight: 700; }.sub { font-size: 18px; fill: #52606d; }
      .actor { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 12; }.actor-service { fill: #fff7ed; stroke: #fb923c; }.actor-store { fill: #f0fdf4; stroke: #4ade80; }.actor-audit { fill: #fdf2f8; stroke: #f472b6; }
      .actor-title { font-size: 17px; font-weight: 700; }.actor-sub { font-size: 14px; fill: #475569; }
      .life { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; }.call { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }.return { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }.async { stroke: #a21caf; stroke-width: 2.5; stroke-dasharray: 6 5; fill: none; marker-end: url(#async); }
      .label { font-size: 15px; fill: #334155; }.small { font-size: 14px; fill: #52606d; }.alt { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }.ok { fill: #ecfdf5; }.error { fill: #fef2f2; }
    </style>
  </defs>
  <rect width="2200" height="1180" fill="#ffffff"/>
  <text x="70" y="60" class="title">创建订单：POST /orders 请求时序</text>
  <text x="70" y="92" class="sub">Handler 创建 2 秒 Context；订单服务先确认用户存在，再写入订单并异步记录审计事件。</text>

  <g>
    <rect x="55" y="130" width="180" height="72" class="actor"/><text x="145" y="160" class="actor-title" text-anchor="middle">客户端</text><text x="145" y="184" class="actor-sub" text-anchor="middle">前端 / 调用方</text>
    <rect x="310" y="130" width="190" height="72" class="actor"/><text x="405" y="160" class="actor-title" text-anchor="middle">请求中间件</text><text x="405" y="184" class="actor-sub" text-anchor="middle">request log</text>
    <rect x="575" y="130" width="190" height="72" class="actor"/><text x="670" y="160" class="actor-title" text-anchor="middle">Order Handler</text><text x="670" y="184" class="actor-sub" text-anchor="middle">HTTP / Context</text>
    <rect x="840" y="130" width="190" height="72" class="actor actor-service"/><text x="935" y="160" class="actor-title" text-anchor="middle">Order Service</text><text x="935" y="184" class="actor-sub" text-anchor="middle">业务规则</text>
    <rect x="1105" y="130" width="190" height="72" class="actor actor-service"/><text x="1200" y="160" class="actor-title" text-anchor="middle">User Service</text><text x="1200" y="184" class="actor-sub" text-anchor="middle">UserFinder</text>
    <rect x="1370" y="130" width="190" height="72" class="actor actor-store"/><text x="1465" y="160" class="actor-title" text-anchor="middle">用户内存仓储</text><text x="1465" y="184" class="actor-sub" text-anchor="middle">MemoryRepository</text>
    <rect x="1635" y="130" width="190" height="72" class="actor actor-store"/><text x="1730" y="160" class="actor-title" text-anchor="middle">订单内存仓储</text><text x="1730" y="184" class="actor-sub" text-anchor="middle">MemoryRepository</text>
    <rect x="1900" y="130" width="190" height="72" class="actor actor-audit"/><text x="1995" y="160" class="actor-title" text-anchor="middle">异步审计日志</text><text x="1995" y="184" class="actor-sub" text-anchor="middle">AsyncLogger</text>
  </g>
  <g class="life"><path d="M145 202 V1090"/><path d="M405 202 V1090"/><path d="M670 202 V1090"/><path d="M935 202 V1090"/><path d="M1200 202 V1090"/><path d="M1465 202 V1090"/><path d="M1730 202 V1090"/><path d="M1995 202 V1090"/></g>

  <path d="M145 255 H405" class="call"/><text x="275" y="240" class="label" text-anchor="middle">POST /orders</text>
  <path d="M405 315 H670" class="call"/><text x="537" y="300" class="label" text-anchor="middle">记录 method / path 后转发</text>
  <rect x="648" y="345" width="44" height="96" fill="#dbeafe" stroke="#60a5fa"/><text x="720" y="380" class="small">DecodeJSON；创建 2 秒 Context</text>
  <path d="M670 465 H935" class="call"/><text x="802" y="450" class="label" text-anchor="middle">Create(ctx, userId, amount)</text>
  <rect x="913" y="495" width="44" height="72" fill="#ffedd5" stroke="#fb923c"/><text x="980" y="530" class="small">校验 userId 与 amount</text>
  <path d="M935 595 H1200" class="call"/><text x="1068" y="580" class="label" text-anchor="middle">FindByID(ctx, userId)</text>
  <path d="M1200 655 H1465" class="call"/><text x="1332" y="640" class="label" text-anchor="middle">FindByID(ctx, id)</text>
  <path d="M1465 715 H1200" class="return"/><text x="1332" y="700" class="label" text-anchor="middle">User / ErrNotFound</text>
  <path d="M1200 765 H935" class="return"/><text x="1068" y="750" class="label" text-anchor="middle">User / error</text>

  <rect x="830" y="800" width="1010" height="115" class="alt ok"/><text x="850" y="830" class="actor-title">用户存在</text>
  <path d="M935 855 H1730" class="call"/><text x="1332" y="840" class="label" text-anchor="middle">Create(ctx, input) → Order(status=pending)</text>
  <path d="M1730 885 H935" class="return"/>
  <path d="M935 905 H1995" class="async"/><text x="1465" y="895" class="label" text-anchor="middle" fill="#a21caf">goroutine：记录 order.created</text>

  <rect x="830" y="935" width="520" height="85" class="alt error"/><text x="850" y="965" class="actor-title">用户不存在或参数无效</text><text x="850" y="992" class="small">Order Service 返回 AppError</text>
  <path d="M935 1060 H670" class="return"/><text x="802" y="1045" class="label" text-anchor="middle">Order / AppError</text>
  <path d="M670 1110 H145" class="return"/><text x="407" y="1095" class="label" text-anchor="middle">201 JSON / 400 JSON</text>
</svg>
