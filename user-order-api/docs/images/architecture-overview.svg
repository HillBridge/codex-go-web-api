<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">user-order-api 生产架构与依赖关系</title><desc id="desc">程序入口经过数据库连接池和迁移，调用 internal/app.NewProduction 组装 HTTP 应用，再由服务层处理用户和订单请求的架构图。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937}.t{font-size:30px;font-weight:700}.g{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.n{fill:#fff;stroke:#94a3b8;stroke-width:2}.e{fill:#eff6ff;stroke:#60a5fa}.h{fill:#f0fdf4;stroke:#4ade80}.v{fill:#fff7ed;stroke:#fb923c}.p{fill:#faf5ff;stroke:#c084fc}.d{fill:#ecfeff;stroke:#22d3ee}.r{fill:#fdf2f8;stroke:#f472b6}.nt{font-size:17px;font-weight:700}.ns{font-size:13px;fill:#475569}.l{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}.i{stroke:#2563eb;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1600" height="900" fill="#fff"/><text x="50" y="55" class="t">user-order-api：生产架构与依赖关系</text><text x="50" y="84" class="ns">实线：运行时调用　蓝色虚线：main 的创建、迁移与依赖注入</text>
<rect x="40" y="110" width="1520" height="175" rx="16" class="g"/><text x="65" y="143" class="nt">启动与基础设施</text><g text-anchor="middle"><rect x="80" y="180" width="190" height="70" rx="12" class="n e"/><text x="175" y="208" class="nt">main()</text><text x="175" y="232" class="ns">MYSQL_DSN</text><rect x="360" y="180" width="210" height="70" rx="12" class="n d"/><text x="465" y="208" class="nt">database.Open</text><text x="465" y="232" class="ns">连接池 + Ping</text><rect x="660" y="180" width="220" height="70" rx="12" class="n d"/><text x="770" y="208" class="nt">ApplyMigrations</text><text x="770" y="232" class="ns">嵌入式向前迁移</text><rect x="970" y="180" width="220" height="70" rx="12" class="n e"/><text x="1080" y="208" class="nt">app.NewProduction</text><text x="1080" y="232" class="ns">组装 MySQL 应用</text><rect x="1280" y="180" width="210" height="70" rx="12" class="n"/><text x="1385" y="208" class="nt">http.Server</text><text x="1385" y="232" class="ns">超时 + 优雅关闭</text></g><path d="M270 215H360M570 215H660M880 215H970M1190 215H1280" class="i"/>
