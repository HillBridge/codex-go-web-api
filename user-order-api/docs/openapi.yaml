openapi: 3.0.3
info:
  title: User Order API
  version: 1.0.0
  description: 用户与订单的 MySQL 持久化 API。
servers:
  - url: http://localhost:8888/api/v1
    description: 本地开发环境
paths:
  /health:
    get:
      summary: 健康检查
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users:
    get:
      summary: 查询用户列表
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AfterID'
      responses:
        '200':
          $ref: '#/components/responses/UserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{id}:
    get:
      summary: 按 ID 查询用户
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders:
    get:
      summary: 查询订单列表
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AfterID'
      responses:
        '200':
          $ref: '#/components/responses/OrderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: 创建订单
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 可选的创建幂等键；去除首尾空白后不能为空，最长 255 个字符。同键同 userId/amount 返回首次创建的订单。
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: 幂等重放成功，返回首次创建的订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/IdempotencyKeyConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{id}:
    get:
      summary: 按 ID 查询订单
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{id}/pay:
    post:
      summary: 确认订单支付
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 支付成功，或订单已是 paid 状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/InvalidOrderState'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{id}/cancel:
    post:
      summary: 取消订单
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 取消成功，或订单已是 cancelled 状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/InvalidOrderState'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    AfterID:
      name: afterId
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    CreateUserRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Ada
        email:
          type: string
          format: email
          example: ada@example.com
    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Ada
        email:
          type: string
          format: email
          example: ada@example.com
        createdAt:
          type: string
          format: date-time
    CreateOrderRequest:
      type: object
      required: [userId, amount]
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 1
        amount:
          type: integer
          format: int64
          minimum: 1
          description: 最小货币单位。
          example: 2599
    Order:
      type: object
      required: [id, userId, amount, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int64
          example: 1
        amount:
          type: integer
          format: int64
          example: 2599
        status:
          type: string
          enum: [pending, paid, cancelled]
          example: pending
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          description: 面向调用方的稳定错误码，不应依赖 error 文案判断分支。
          example: USER_NOT_FOUND
        error:
          type: string
  responses:
    UserList:
      description: 用户游标分页结果
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/User'
              nextCursor:
                type: string
                description: 存在下一页时返回；作为下次请求的 afterId。
    OrderList:
      description: 订单游标分页结果
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              nextCursor:
                type: string
                description: 存在下一页时返回；作为下次请求的 afterId。
    BadRequest:
      description: 参数或请求体不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UserNotFound:
      description: 用户不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrderNotFound:
      description: 订单不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyKeyConflict:
      description: 幂等键已被不同的创建请求使用，错误码为 IDEMPOTENCY_KEY_CONFLICT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidOrderState:
      description: 订单当前状态不允许该操作，错误码为 INVALID_ORDER_STATE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type 不是 application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: 未预期的服务端错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
